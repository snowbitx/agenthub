name: Sync GitHub metrics

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync stars/forks/activity
        run: node scripts/sync-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated metrics
        run: |
          if [[ -n "$(git status --porcelain data/metrics.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/metrics.json
            git commit -m "chore: daily GitHub metrics sync"
            git push
          else
            echo "No metric changes"
          fi
